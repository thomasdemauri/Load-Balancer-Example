version: '3.8'

services:
  api1:
    build: .
    container_name: api_container_1

  api2:
    build: .
    container_name: api_container_2

  api3:
    build: .
    container_name: api_container_3


  web:
    image: nginx:latest
    container_name: web_container
    ports:
    - "8080:80"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2      
